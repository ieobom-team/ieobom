spring:
  application:
    name: ieobom-api

  # DB 접속 정보는 코드에 적지 않는다. 로컬은 .env, 배포는 환경변수로 주입한다.
  # 로컬 MySQL 8.4 는 루트의 docker-compose.yml 로 띄운다. (docs/development.md)
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ieobom?characterEncoding=UTF-8&serverTimezone=Asia/Seoul}
    username: ${DB_USERNAME:ieobom}
    password: ${DB_PASSWORD:ieobom}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # 스키마는 Flyway 가 만든다. Hibernate 는 엔티티와 어긋나면 기동을 막는 역할만 한다. (#19)
      # update 로 되돌리면 마이그레이션에 없는 변경이 DB 에 조용히 생겨 배포와 로컬이 갈라진다.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    # 이미 ddl-auto: update 로 자란 로컬 DB 를 baseline 으로 찍고 V1 을 건너뛴다.
    # false 로 내리면 팀원 로컬이 전부 즉시 실패한다.
    #
    # 대신 로컬(baseline → V1 skip)과 배포(빈 DB → V1 실행)가 서로 다른 경로로 만들어진
    # 스키마를 쓰게 된다. 이 비대칭을 없애려면 **V1 병합 후 각자 로컬 DB 를 한 번 초기화한다.**
    #
    #   docker compose down -v && docker compose up -d
    #
    # 로컬 데이터는 시더가 다시 넣는 시드뿐이라 잃을 것이 없다. (docs/development.md)
    baseline-on-migrate: true
    locations: classpath:db/migration

# AI 구조화. 키는 여기 적지 않고 환경변수로만 들어온다. (docs/development.md)
# 키가 비어 있어도 애플리케이션은 기동되고, 구조화를 호출하는 시점에 503 으로 알린다.
ieobom:
  # 시설 운영 시각. 후속 업무 기한의 상한이 여기서 나온다. (Manyfast F-IVFNPC rules)
  # 하원 시각은 시설마다 다르지만 지금은 값 하나로 둔다. 시설별 설정이 필요해지면 별도 Issue 다. (#13)
  # 값을 직접 적을 때는 따옴표로 감싼다. YAML 은 따옴표 없는 18:00 을 시각이 아니라 60진수 정수(1080)로 읽는다.
  facility:
    dismissal-time: ${FACILITY_DISMISSAL_TIME:18:00}

  llm:
    base-url: ${LLM_BASE_URL:https://api.openai.com/v1}
    model: ${LLM_MODEL:gpt-4.1-mini}
    api-key: ${LLM_API_KEY:}
    timeout: ${LLM_TIMEOUT:60s}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.ieobom.api: DEBUG
