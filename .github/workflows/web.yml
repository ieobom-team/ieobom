# 프론트엔드(apps/web) 검증. apps/web 이 바뀐 PR 에서만 돈다.
name: Web

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/web.yml"
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/web.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/web

jobs:
  build:
    name: lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci

      - name: lint
        run: npm run lint

      - name: build
        run: npm run build
