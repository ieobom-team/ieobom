# 백엔드(apps/api) 검증. apps/api 가 바뀐 PR 에서만 돈다.
#
# 테스트는 H2 인메모리를 쓰므로 DB 컨테이너가 필요 없다.
# (apps/api/src/test/resources/application.yml 참고)
name: API

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/api/**"
      - ".github/workflows/api.yml"
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - ".github/workflows/api.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/api

jobs:
  build:
    name: gradlew build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - run: chmod +x ./gradlew

      - name: build
        run: ./gradlew build --no-daemon

      - name: 테스트 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: api-test-report
          path: apps/api/build/reports/tests/test
