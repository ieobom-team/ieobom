name: 기능 구현
description: Manyfast 명세 하나를 구현하는 작업
title: "[feat] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        **Manyfast가 개발 명세의 유일한 기준입니다.**
        아래 참조가 비어 있으면 AI 에이전트는 구현하지 않고 보완을 요청합니다.

  - type: input
    id: manyfast-requirement
    attributes:
      label: Manyfast Requirement
      description: Manyfast에 표시된 ID를 그대로 적습니다. 예 - R-LIEATL 현장 인계 정보 수집
      placeholder: R-LIEATL
    validations:
      required: true

  - type: input
    id: manyfast-feature
    attributes:
      label: Manyfast Feature / Spec
      description: Manyfast에 표시된 ID를 그대로 적습니다. 임의로 번호를 붙이지 않습니다.
      placeholder: F-XXXXXX / S-XXXXXX
    validations:
      required: true

  - type: input
    id: manyfast-version
    attributes:
      label: 기준 버전
      description: 구현 기준이 되는 Manyfast 저장 버전
      placeholder: v0.1-core-flow
    validations:
      required: true

  - type: input
    id: manyfast-screen
    attributes:
      label: 관련 화면
      description: 유저플로우 노드 ID 또는 와이어프레임 페이지 ID. 화면이 없는 작업이면 비웁니다.
      placeholder: n20 어르신 인계 카드 상세

  - type: textarea
    id: goal
    attributes:
      label: 구현 목표
      description: Manyfast Spec의 완료 조건을 코드로 어떻게 충족할 것인가
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      description: 데모와 QA에서 독립적으로 확인 가능한 동작으로 적습니다.
      value: |
        - [ ] Manyfast 명세 충족
        - [ ] 테스트 통과
        - [ ] PR에 검증 결과 기록
    validations:
      required: true

  - type: textarea
    id: out-of-scope
    attributes:
      label: 범위 제외
      description: 이 Issue에서 하지 않을 것. 비워두면 에이전트가 범위를 넓힐 수 있습니다.
      placeholder: |
        - 음성 입력 (P1)
        - 로그인/권한
    validations:
      required: true

  - type: textarea
    id: files
    attributes:
      label: 예상 영향 파일
      placeholder: apps/api/src/main/java/com/ieobom/api/handover/...

  - type: textarea
    id: contracts
    attributes:
      label: 관련 기술 계약
      description: 이 작업이 읽거나 바꾸는 `docs/contracts/` 문서. 계약이 바뀌면 같은 PR에서 갱신합니다.
      placeholder: docs/contracts/README.md

  - type: textarea
    id: risk
    attributes:
      label: 위험 · 미결정 사항
      description: 추측해서 채우지 말고, 모르는 것은 모른다고 남깁니다.

  - type: dropdown
    id: priority
    attributes:
      label: 우선순위
      options:
        - P0 (데모 코어 플로우)
        - P1 (있으면 좋음)
        - P2 (이후)
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 영역
      multiple: true
      options:
        - frontend
        - backend
        - ai
        - infra
        - docs
    validations:
      required: true
